[package]
name = "swatcrypt"
version = "1.0.0"
edition = "2021"
authors = ["Swatto"]
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
bytes = "1"
chacha20poly1305 = { version = "0.10", features = ["std", "stream"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.27", default-features = false, features = ["wgpu", "default_fonts"] }
flate2 = { version = "1", features = ["rust_backend"] }
humansize = "2"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
indicatif = "0.17"
rand = "0.8"
rand_core = "0.6"
rfd = "0.14"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
single-instance = "0.3"
tar = "0.4"
tempfile = "3"
thiserror = "1"
walkdir = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.50"

[build-dependencies]
ico = "0.3"
winres = "0.1"

[[bin]]
name = "swatcrypt"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
